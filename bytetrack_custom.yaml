# ByteTrack Custom Configuration for TrekIT Traffic Tracker
# Optimized for dashcam / traffic CCTV footage to prevent track fragmentation

tracker_type: bytetrack
track_high_thresh: 0.40    # High-confidence detections for primary association
track_low_thresh: 0.10     # Low-confidence detections for secondary recovery association
new_track_thresh: 0.50     # Confirmed detection required to initialize a NEW track (filters out noise)
track_buffer: 60           # Retain lost tracks for 60 frames (2+ seconds) through glare, occlusion, or blur
match_thresh: 0.75         # IoU threshold for matching
fuse_score: True
