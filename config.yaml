# ============================================================
#  Traffic Tracker AI — Central Configuration
# ============================================================

# ── Paths ───────────────────────────────────────────────────
paths:
  models_dir: "models"
  data_dir: "data"
  logs_dir: "logs"

  # Trained weights (placed here after training on your RTX 3060 PC)
  vehicle_attributes_weights: "models/vehicle_attributes.pt"  # Unified Multi-Task (Color + Type)
  yolo_weights: "models/plate_detector.pt"
  lprnet_weights: "models/lprnet.pt"                          # Dedicated sequence ALPR model
  color_weights: "models/color_classifier.pt"
  type_weights:  "models/type_classifier.pt"

  # ONNX variants (optional, faster on CPU)
  vehicle_attributes_onnx: "models/vehicle_attributes.onnx"
  yolo_onnx:   "models/plate_detector.onnx"
  lprnet_onnx: "models/lprnet.onnx"
  color_onnx:  "models/color_classifier.onnx"
  type_onnx:   "models/type_classifier.onnx"

# ── Pretrained fallback auto-download ───────────────────────
pretrained:
  # YOLO11s pretrained on COCO — used if custom weights not found
  yolo_fallback_url: "https://github.com/ultralytics/assets/releases/download/v8.3.0/yolo11s.pt"
  # MobileNetV3-Large from torchvision — used if classifier weights not found
  mobilenet_pretrained: true

# ── Detection ───────────────────────────────────────────────
detection:
  confidence_threshold: 0.45      # Vehicle detection confidence threshold (eliminates background artifacts)
  nms_iou_threshold: 0.45         # Non-max suppression IoU (merges duplicate boxes)
  min_box_area: 2500              # Min bounding box area in pixels (50x50) to ignore distant noise
  input_size: 640                 # 640px / 1024px input resolution
  device: "cuda"                  # CUDA GPU (e.g. RTX 3060 12GB) or CPU
  plate_check_every_n: 1          # Check plate on every frame per track
  fp16: true                      # Native FP16 Half Precision acceleration on CUDA Tensor Cores

  # Class IDs in the custom YOLO model
  vehicle_class_ids: [2, 3, 5, 7]   # COCO: car, motorcycle, bus, truck
  plate_class_id: 0                  # Custom model: license_plate

# ── Tracking ────────────────────────────────────────────────
tracking:
  tracker: "bytetrack_custom.yaml"  # Custom ByteTrack config with 60-frame buffer
  max_age: 60                       # 60 frames (2+ seconds) to keep lost track alive
  min_hits: 2                       # Min consecutive detections before confirming track
  iou_threshold: 0.3                # Association IoU threshold
  ema_alpha: 0.25                   # Exponential Moving Average momentum for color & type smoothing

# ── Classification ──────────────────────────────────────────
classification:
  input_size: 224                 # MobileNetV3 input (pixels)
  confidence_cutoff: 0.35         # Min softmax confidence to accept a class label

  color_classes:
    - "Beige"
    - "Black"
    - "Blue"
    - "Brown"
    - "Gold"
    - "Green"
    - "Grey"
    - "Orange"
    - "Pink"
    - "Purple"
    - "Red"
    - "Silver"
    - "Tan"
    - "White"
    - "Yellow"

  type_classes:
    - "Convertible"
    - "Coupe"
    - "Hatchback"
    - "SUV"
    - "Sedan"
    - "Truck"
    - "Van"

  classify_every_n_frames: 2     # Run classifier every 2 frames for fast voting

# ── OCR ─────────────────────────────────────────────────────
ocr:
  languages: ["en"]              # EasyOCR language list
  gpu: true                     # CUDA GPU enabled for EasyOCR
  min_confidence: 0.15           # Min OCR confidence threshold (captures shadowed/distant plates)
  ocr_every_n_frames: 1          # Run EasyOCR every frame per vehicle

  # Image preprocessing toggles
  preprocessing:
    grayscale: true
    clahe: true                  # Gentle CLAHE (clip=2.0) for contrast boost
    adaptive_threshold: false    # OFF: binarization destroys EasyOCR gradient features
    morph_cleanup: false         # OFF: morphological ops break letter contours for CRAFT
    deskew: true                 # ON: fixed Otsu-based foreground isolation

  # Plate text post-processing
  regex_patterns:
    - "^[0-9A-Z]{5,8}$"                  # Standard US 5-8 alphanumeric plate
    - "^[0-9][A-Z]{3}[0-9]{3}$"          # Standard California 7-char format (e.g. 9JWM255, 8MZW276)
    - "^[A-Z]{1,3}[0-9]{1,4}[A-Z]{0,3}$" # Standard alphanumeric formats
  strip_chars: "!@#$%^&*()_+-=[]{}|;':\",./<>?"

# ── Dashboard ───────────────────────────────────────────────
dashboard:
  host: "127.0.0.1"
  port: 7860
  theme: "dark"
  max_video_duration_sec: 300    # 5-minute cap for uploaded videos
  webcam_fps_target: 15          # Target FPS for webcam mode
  log_max_rows: 500              # Max rows in the on-screen plate log table

# ── Logging & Retention ─────────────────────────────────────
logging:
  level: "INFO"                  # DEBUG | INFO | WARNING | ERROR
  log_to_file: true
  log_filename: "logs/tracker.log"
  retention:
    enabled: true
    max_age_days: 7              # Delete snapshots older than 7 days
    max_dir_size_mb: 2000        # Cap total snapshot directory size to 2 GB
    log_max_bytes: 10485760      # Rotate tracker.log at 10 MB
    log_backup_count: 5          # Keep up to 5 rotated log files

