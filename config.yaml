# ============================================================
#  Traffic Tracker AI — Central Configuration
# ============================================================

# ── Paths ───────────────────────────────────────────────────
paths:
  models_dir: "models"
  data_dir: "data"
  logs_dir: "logs"

  # Trained weights (placed here after downloading from Colab)
  yolo_weights: "models/plate_detector.pt"
  color_weights: "models/color_classifier.pt"
  type_weights:  "models/type_classifier.pt"

  # ONNX variants (optional, faster on CPU)
  yolo_onnx:   "models/plate_detector.onnx"
  color_onnx:  "models/color_classifier.onnx"
  type_onnx:   "models/type_classifier.onnx"

# ── Pretrained fallback auto-download ───────────────────────
pretrained:
  # YOLOv8n pretrained on COCO — used if yolo_weights not found
  yolo_fallback_url: "https://github.com/ultralytics/assets/releases/download/v8.2.0/yolov8n.pt"
  # MobileNetV3-Small from torchvision — used if color/type weights not found
  mobilenet_pretrained: true

# ── Detection ───────────────────────────────────────────────
detection:
  confidence_threshold: 0.20      # Lowered from 0.35 to catch small/distant license plates
  nms_iou_threshold: 0.45         # Non-max suppression IoU
  input_size: 640                 # 640px / 1024px input resolution
  device: "cuda"                  # RTX 4080 CUDA GPU
  plate_check_every_n: 1          # Check plate on every frame per track
  engine: "tensorrt"              # "pt" or "tensorrt"
  half_precision: true            # FP16 acceleration for RTX GPUs

  # Class IDs in the custom YOLO model
  vehicle_class_ids: [2, 3, 5, 7]   # COCO: car, motorcycle, bus, truck
  plate_class_id: 0                  # Custom model: license_plate

# ── Tracking ────────────────────────────────────────────────
tracking:
  tracker: "bytetrack"            # Built-in ultralytics tracker
  max_age: 30                     # Frames to keep a track alive without a match
  min_hits: 3                     # Min consecutive detections before confirming track
  iou_threshold: 0.3

  # Temporal voting
  vote_window: 25                 # Expanded vote window to stabilize labels across long tracks
  min_votes: 3                    # Min votes needed to output a stable label

# ── Classification ──────────────────────────────────────────
classification:
  input_size: 224                 # MobileNetV3 input (pixels)
  confidence_cutoff: 0.35         # Min softmax confidence to accept a class label

  color_classes:
    - "Beige"
    - "Black"
    - "Blue"
    - "Brown"
    - "Gold"
    - "Green"
    - "Grey"
    - "Orange"
    - "Pink"
    - "Purple"
    - "Red"
    - "Silver"
    - "Tan"
    - "White"
    - "Yellow"

  type_classes:
    - "Convertible"
    - "Coupe"
    - "Hatchback"
    - "SUV"
    - "Sedan"
    - "Truck"
    - "Van"

  classify_every_n_frames: 2     # Run classifier every 2 frames for fast voting

# ── OCR ─────────────────────────────────────────────────────
ocr:
  languages: ["en"]              # EasyOCR language list
  gpu: true                     # CUDA GPU enabled for EasyOCR
  min_confidence: 0.15           # Min OCR confidence threshold (captures shadowed/distant plates)
  ocr_every_n_frames: 1          # Run EasyOCR every frame per vehicle

  # Image preprocessing toggles
  preprocessing:
    grayscale: true
    clahe: true                  # Gentle CLAHE (clip=2.0) for contrast boost
    adaptive_threshold: false    # OFF: binarization destroys EasyOCR gradient features
    morph_cleanup: false         # OFF: morphological ops break letter contours for CRAFT
    deskew: true                 # ON: fixed Otsu-based foreground isolation

  # Plate text post-processing
  regex_patterns:
    - "^[A-Z0-9]{2,12}$"         # Flexible alphanumeric plate reading
    - "^[A-Z]{1,3}[0-9]{1,4}[A-Z]{0,3}$"  # Common US/EU formats
  strip_chars: "!@#$%^&*()_+-=[]{}|;':\",./<>?"

# ── Dashboard ───────────────────────────────────────────────
dashboard:
  host: "127.0.0.1"
  port: 7860
  theme: "dark"
  max_video_duration_sec: 300    # 5-minute cap for uploaded videos
  webcam_fps_target: 15          # Target FPS for webcam mode
  log_max_rows: 500              # Max rows in the on-screen plate log table

# ── Logging & Retention ─────────────────────────────────────
logging:
  level: "INFO"                  # DEBUG | INFO | WARNING | ERROR
  log_to_file: true
  log_filename: "logs/tracker.log"
  retention:
    enabled: true
    max_age_days: 7              # Delete snapshots older than 7 days
    max_dir_size_mb: 2000        # Cap total snapshot directory size to 2 GB
    log_max_bytes: 10485760      # Rotate tracker.log at 10 MB
    log_backup_count: 5          # Keep up to 5 rotated log files

